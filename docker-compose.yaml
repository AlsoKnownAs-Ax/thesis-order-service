services:
  benchmark-service:
    container_name: thesis-benchmark-service
    image: thesis-benchmark-service:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9093:9093"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    networks:
      thesis-net:
        aliases:
          - benchmark-service
    environment:
      - TZ=UTC
      - SPRING_PROFILES_ACTIVE=docker

networks:
  thesis-net:
    external: true
    name: thesis-net
